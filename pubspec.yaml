name: mic_backoffice
description: "Church Management System - A comprehensive solution for member management, attendance, giving, and more."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Supabase for backend & authentication
  supabase_flutter: ^2.5.6
  
  # Offline Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Data & Serialization
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  pdf: ^3.11.1
  
  # Date & Time
  intl: ^0.20.2
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # Utilities
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  collection: ^1.18.0
  share_plus: ^7.2.1
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  webview_flutter: ^4.4.2
  
  # Push Notifications
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  workmanager: ^0.6.0
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/android-chrome-512x512.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/android-chrome-512x512.png
    background_color: "#F5F5F0"
    theme_color: "#1B3A57"
  windows:
    generate: true
    image_path: assets/images/android-chrome-512x512.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/android-chrome-512x512.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/android-chrome-512x512.png
