name: Build Flutter Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (.exe)
        shell: powershell
        run: |
          $pubspecVersionLine = (Select-String -Path "pubspec.yaml" -Pattern "^\s*version:\s*").Line
          if (-not $pubspecVersionLine) { throw "Could not find version in pubspec.yaml" }
          $version = ($pubspecVersionLine -split "version:\s*")[1].Trim()
          $version = ($version -split "\+")[0].Trim()

          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc "windows\installer.iss" /DMyAppName="mic_backoffice" /DMyAppVersion="$version" /DMyAppPublisher="MIC" /DMyAppURL="https://example.com" /DMyAppExeName="mic_backoffice.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/installer/*.exe
